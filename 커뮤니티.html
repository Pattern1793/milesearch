<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mile · 커뮤니티</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #FAF8F5;
      --bg-card: #FFFFFF;
      --text-main: #1A1A1A;
      --text-muted: #666059;
      --text-light: #8C857B;
      --accent-orange: #E05A36;
      --accent-hover: #C84927;
      --border-color: #E5E0D8;
      --border-dark: #1A1A1A;
      --font-serif: 'Noto Serif KR', serif;
      --font-sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }

    header {
      position: sticky; top: 0; z-index: 50;
      background-color: rgba(250, 248, 245, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
    }
    .header-container {
      max-width: 1280px; margin: 0 auto; padding: 1.25rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-serif); font-size: 1.35rem; font-weight: 700; }
    .logo-badge { background: var(--text-main); color: #fff; font-family: var(--font-sans); font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 99px; }

    main { max-width: 800px; margin: 0 auto; padding: 3rem 2rem 5rem; }

    .page-title { font-family: var(--font-serif); font-size: 2.5rem; margin-bottom: 0.5rem; }
    .page-sub { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.05rem; }

    /* Post Input Form */
    .post-creator {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .post-textarea {
      width: 100%; border: none; outline: none;
      resize: none; font-size: 1rem; font-family: var(--font-sans);
      background: transparent; height: 80px; margin-bottom: 1rem;
    }
    .creator-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1rem; }
    .post-btn {
      background: var(--accent-orange); color: #fff; border: none;
      padding: 0.6rem 1.4rem; border-radius: 4px; font-weight: 500;
      cursor: pointer; transition: background 0.2s;
    }
    .post-btn:hover { background: var(--accent-hover); }

    /* Post Feed */
    .post-feed { display: flex; flex-direction: column; gap: 1.25rem; }
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px; padding: 1.5rem;
    }
    .post-header { display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--text-light); }
    .post-author { font-weight: 600; color: var(--text-main); }
    .post-content { font-size: 1rem; color: var(--text-main); margin-bottom: 1.25rem; white-space: pre-line; }
    .post-actions { display: flex; gap: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem; font-size: 0.85rem; color: var(--text-muted); }
    .action-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; }
    .action-btn:hover { color: var(--accent-orange); }

    footer { border-top: 1px solid var(--border-color); padding: 2rem; text-align: center; color: var(--text-light); font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="#" class="logo">
        mile <span class="logo-badge">자립 커뮤니티</span>
      </a>
      <a href="javascript:history.back()" style="font-size: 0.9rem; color: var(--text-muted);">← 메인으로 돌아가기</a>
    </div>
  </header>

  <main>
    <h1 class="page-title">자취 이모저모</h1>
    <p class="page-sub">독립 생활 이야기, 꿀팁, 고민을 함께 나눠보세요.</p>

    <!-- Post Creation Box -->
    <div class="post-creator">
      <textarea class="post-textarea" id="postInput" placeholder="자취 라이프나 공유하고 싶은 팁을 남겨보세요..."></textarea>
      <div class="creator-bottom">
        <span style="font-size: 0.85rem; color: var(--text-light);">익명 작성 가능</span>
        <button class="post-btn" onclick="addPost()">글쓰기</button>
      </div>
    </div>

    <!-- Feed Section -->
    <div class="post-feed" id="postFeed">
      <div class="post-card">
        <div class="post-header">
          <span class="post-author">익명 (자취 2년차)</span>
          <span>방금 전</span>
        </div>
        <div class="post-content">원룸 첫 자취할 때 수압이랑 하수구 냄새 꼭 체크하세요! 부동산 따라갔을 때 변기 물 내려보는 거 필수입니다 👍</div>
        <div class="post-actions">
          <button class="action-btn" onclick="likePost(this)">❤️ <span>12</span></button>
          <button class="action-btn">💬 댓글 3</button>
        </div>
      </div>

      <div class="post-card">
        <div class="post-header">
          <span class="post-author">익명 (신촌 청년)</span>
          <span>1시간 전</span>
        </div>
        <div class="post-content">이번 청년월세 지원사업 신청하신 분 계신가요? 서류 준비할 때 주의할 점 공유드립니다.</div>
        <div class="post-actions">
          <button class="action-btn" onclick="likePost(this)">❤️ <span>8</span></button>
          <button class="action-btn">💬 댓글 5</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 mile Community. 존중하는 분위기의 대화 공간을 만들어주세요.</p>
  </footer>

  <script>
    function addPost() {
      const input = document.getElementById('postInput');
      const text = input.value.trim();
      if (!text) return alert('내용을 입력해주세요.');

      const feed = document.getElementById('postFeed');
      const newPost = document.createElement('div');
      newPost.className = 'post-card';
      newPost.innerHTML = `
        <div class="post-header">
          <span class="post-author">익명 (방금 작성)</span>
          <span>방금 전</span>
        </div>
        <div class="post-content">${text}</div>
        <div class="post-actions">
          <button class="action-btn" onclick="likePost(this)">❤️ <span>0</span></button>
          <button class="action-btn">💬 댓글 0</button>
        </div>
      `;

      feed.prepend(newPost);
      input.value = '';
    }

    function likePost(btn) {
      const countSpan = btn.querySelector('span');
      let count = parseInt(countSpan.innerText);
      countSpan.innerText = count + 1;
    }
  </script>
</body>
</html>
